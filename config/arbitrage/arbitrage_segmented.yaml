# VAR–Lighter delivery template. Fill your own parameters; monitor_only defaults to true.
system_mode:
  monitor_only: true
  data_freshness_seconds: 2.5
  bootstrap_positions_on_startup: true
  bootstrap_positions_block_open_until_success: true
  bootstrap_positions_fetch_timeout_seconds: 30
  bootstrap_positions_retry_interval_seconds: 10
  bootstrap_positions_retry_max_attempts: 5
  bootstrap_positions_empty_confirm_attempts: 10
  bootstrap_positions_empty_confirm_interval_seconds: 1
  bootstrap_positions_block_open_on_mismatch: true
  bootstrap_positions_qty_tolerance: 0
decision:
  deduct_fees: true
  exchange_fee_config:
    default:
      limit_fee_rate: 0
      market_fee_rate: 0
risk_control:
  balance_management:
    min_balance_warning: 5000.0
    min_balance_close_position: 15000.0
    force_close_mode: grid_sequential
    check_interval: 10
    sound_alarm_enabled: true
  open_only_close:
    low_balance:
      enabled: true
      min_equity_usdc: 20000.0
      sound_alarm_enabled: true
      min_equity_usdc_by_exchange: {}
    max_exchange_position_value:
      enabled: true
      max_value_usdc: 160000.0
      sound_alarm_enabled: false
      max_value_usdc_by_exchange: {}
    dynamic_max_exchange_position_value:
      enabled: true
      equity_multiplier: 5.5
    price_volatility:
      trigger_symbols:
      - BTC
      - ETH
      - SOL
      enabled: true
      window_seconds: 300
      threshold_pct: 3
      block_seconds: 1800
      apply_to_all_symbols: true
      sound_alarm_enabled: true
  execution_pause:
    enabled: true
    consecutive_failures: 3
    pause_minutes: 45
  slippage_pause:
    enabled: true
    negative_slippage_threshold_pct: 0.08
    pause_seconds: 900
    cooldown_seconds: 60
    apply_to_open: true
    apply_to_close: true
    burst_negative_slippage_pause:
      enabled: true
      window_seconds: 180
      count_threshold: 5
    high_slippage_reconnect:
      enabled: false
      window_trades: 10
      count_threshold: 5
      high_slippage_threshold_pct: 0.01
      cooldown_seconds: 300
  api_failure_pause:
    enabled: false
    consecutive_failures: 10
    min_interval_seconds: 30
    window_seconds: 600
    pause_seconds: 900
  order_ws_latency_pause:
    enabled: true
    threshold_seconds: 3.2
    pause_seconds: 1000
    block_position_alignment_auto_fix: false
  position_alignment_auto_fix:
    enabled: false
    cooldown_seconds: 15
    max_executions_per_window: 3
    window_seconds: 14400
  position_mismatch_pause:
    enabled: true
    mismatch_seconds: 10
order_execution:
  limit_order_timeout: 10
  lighter_market_order_timeout: 10
  max_retry_count: 3
default_config:
  grid_config:
    initial_spread_threshold: 0.03
    grid_step: 0.03
    max_segments: 5
    split_order_size: 1.0
    scalping_enabled: false
    scalping_trigger_segment: 10
    scalping_profit_threshold: 0.02
    use_symmetric_close: true
    profit_per_segment: 0.045
    scalp_profit_threshold: 0.02
    spread_persistence_seconds: 5
    strict_persistence_check: true
    require_orderbook_liquidity: true
    min_orderbook_quantity: 0.01
    orderbook_aggregate_levels: 1
    skip_orderbook_liquidity_exchanges:
    - variational
    slippage_tolerance: 0.001
    price_stability_window_seconds: 2
    price_stability_threshold_pct: 0.02
    max_local_orderbook_spread_pct: 0.05
    ema_spread_gate_enabled: false
    ema_spread_window_seconds: 6
    ema_spread_deviation_pct: 0.011
    ema_spread_strict_samples_per_second: true
  quantity_config:
    base_quantity: 1.0
    quantity_mode: fixed
    target_value_usdc: 100.0
    quantity_precision: 2
    min_exchange_order_qty:
      default: 0.0
  risk_config:
    max_position_value: 1000.0
    max_loss_percent: 2.0
    enable_funding_rate_risk: true
    max_unfavorable_funding_hours: 8
    funding_rate_diff_threshold: 0.01
symbol_configs:
  BTC-USDC-PERP:
    enabled: true
    grid_config:
      initial_spread_threshold: 0.08
      grid_step: 0.01
      max_segments: 10
      limit_price_offset_abs: 1800
      max_local_orderbook_spread_pct: 0.05
      slippage_tolerance: 0.001
    quantity_config:
      base_quantity: 0.05
      split_order_size: 0.025
      quantity_mode: fixed
      quantity_precision: 5
      target_value_usdc: 1000.0
      min_exchange_order_qty:
        default: 0.0002
  ETH-USDC-PERP:
    enabled: true
    grid_config:
      initial_spread_threshold: 0.08
      grid_step: 0.01
      max_segments: 10
      limit_price_offset_abs: 62
      max_local_orderbook_spread_pct: 0.05
    quantity_config:
      base_quantity: 1.5
      split_order_size: 0.75
      quantity_mode: fixed
      quantity_precision: 2
      target_value_usdc: 500.0
      min_exchange_order_qty:
        default: 0.005
  SOL-USDC-PERP:
    enabled: true
    grid_config:
      initial_spread_threshold: 0.08
      grid_step: 0.01
      max_segments: 12
      limit_price_offset_abs: 3
      max_local_orderbook_spread_pct: 0.05
    quantity_config:
      base_quantity: 30
      split_order_size: 15
      quantity_mode: fixed
      quantity_precision: 3
      target_value_usdc: 500.0
      min_exchange_order_qty:
        default: 0.005
  HYPE-USDC-PERP:
    enabled: true
    grid_config:
      initial_spread_threshold: 0.04
      grid_step: 0.02
      max_segments: 10
      limit_price_offset_abs: 0.5
      max_local_orderbook_spread_pct: 0.1
    quantity_config:
      base_quantity: 150
      split_order_size: 75
      quantity_mode: fixed
      quantity_precision: 2
      target_value_usdc: 500.0
      min_exchange_order_qty:
        default: 1
  BNB-USDC-PERP:
    enabled: true
    grid_config:
      initial_spread_threshold: 0.01
      grid_step: 0.01
      max_segments: 20
      limit_price_offset_abs: 0.01
      max_local_orderbook_spread_pct: 0.1
      slippage_tolerance: 0.001
      require_orderbook_liquidity: true
      min_orderbook_quantity: 3
    quantity_config:
      base_quantity: 2
      split_order_size: 1
      quantity_mode: fixed
      quantity_precision: 2
      target_value_usdc: 500.0
      min_exchange_order_qty:
        default: 1
